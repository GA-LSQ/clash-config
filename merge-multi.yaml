# ==============================================================================
#  Clash Verge Rev · 全局扩展配置（Merge）· 多机场 Provider 版
# ==============================================================================

# -------- TUN -----------------------------------------------------------
tun:
  enable: true
  stack: mixed
  device: Mihomo
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53
  mtu: 9000

# -------- DNS -----------------------------------------------------------
dns:
  enable: true
  ipv6: false
  listen: 127.0.0.1:1053
  prefer-h3: false
  respect-rules: true

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.local"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.srv.nintendo.net"
    - "*.n.n.srv.nintendo.net"
    - "+.xboxlive.com"
    - "*.mcdn.bilivideo.cn"
    - "+.push.apple.com"
    - "music.163.com"
    - "+.126.net"
    - "+.127.net"
    - "lens.l.google.com"
    - "stun.l.google.com"
    - "+.cs.steampowered.com"
    - "+.steamcontent.com"
    - "+.steampipe.akamaized.net"
    - "+.steamcdn-a.akamaihd.net"
    - "+.steampipe.steamcontent.com"
    - "+.steamusercontent.com"
    - "+.steamstatic.com"

  fallback: []

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query

  nameserver-policy:
    "rule-set:cn-domain":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "rule-set:private-domain":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "+.qq.com,+.tencent.com,+.weixin.qq.com":
      - https://doh.pub/dns-query
    "+.taobao.com,+.tmall.com,+.aliyun.com,+.alipay.com":
      - https://dns.alidns.com/dns-query
    "+.jd.com,+.baidu.com,+.bilibili.com,+.zhihu.com,+.163.com":
      - https://dns.alidns.com/dns-query
    "+.bytedance.com,+.douyin.com,+.toutiao.com":
      - https://dns.alidns.com/dns-query
    "+.cs.steampowered.com,+.steamcontent.com,+.steampipe.akamaized.net,+.steamcdn-a.akamaihd.net,+.steampipe.steamcontent.com,+.steamusercontent.com,+.steamstatic.com":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query

# -------- 嗅探 ------------------------------------------------------------
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# -------- 连接调优 ----------------------------------------------------------
tcp-concurrent: true
unified-delay: true
find-process-mode: "off"
global-client-fingerprint: chrome
profile:
  store-selected: true
  store-fake-ip: true

# -------- 丢掉订阅自带节点 ------------------------------------------------------
proxies: []

# ==============================================================================
proxy-providers:
  airport1:
    type: http
    url: "https://你的机场1订阅链接&flag=clash"
    interval: 3600
    path: ./providers/airport1.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: true
    override:
      additional-prefix: "[A] "

  airport2:
